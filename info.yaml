# Tiny Tapeout project information
project:
  title: "FP16 MAC Unit" # Project title
  author: "Sai Kiran Ratna" # Your name
  discord: "undopedsilicon" # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description: "FP16 Multiply-Accumulate unit evaluating fixed test cases and outputting to a 7-segment display." # One line description of what your project does
  language: "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz: 100 # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1" # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2
  
  source_files:
    - "tt_um_fp16_mac.v"
    - "FP16.v"
    - "nfp_add_single.v"
    - "nfp_mul_single.v"
  top_module:  "tt_um_fp16_mac"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Test Case Select [0]"
  ui[1]: "Test Case Select [1]"
  ui[2]: "Test Case Select [2]"
  ui[3]: "Display Nibble Select [0]"
  ui[4]: "Display Nibble Select [1]"
  ui[5]: "Unused"
  ui[6]: "Unused"
  ui[7]: "Unused"

  # Outputs
  uo[0]: "Segment A"
  uo[1]: "Segment B"
  uo[2]: "Segment C"
  uo[3]: "Segment D"
  uo[4]: "Segment E"
  uo[5]: "Segment F"
  uo[6]: "Segment G"
  uo[7]: "Decimal Point (off)"

  # Bidirectional pins
  uio[0]: "Unused"
  uio[1]: "Unused"
  uio[2]: "Unused"
  uio[3]: "Unused"
  uio[4]: "Unused"
  uio[5]: "Unused"
  uio[6]: "Unused"
  uio[7]: "Unused"

# Do not change!
yaml_version: 6
